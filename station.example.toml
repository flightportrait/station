# Station configuration. Every mistake in this file produces a sentence
# that says what to fix; stationd refuses to start half-configured.

[station]
name = "my-station"
lat = 1.29
lon = 103.85
# Antenna altitude: meters, or with a unit ("65m", "213ft"). MLAT solves
# other people's aircraft with this; a wrong value quietly harms them.
alt = "65m"

[input]
# Where Mode S frames come from: an existing readsb's Beast output.
beast = "127.0.0.1:30005"

# One block per aggregator. Non-exclusive: add as many as you like.
# adsb = raw Beast destination (needs [programs].readsb, which carries it
# as a --net-connector); mlat = MLAT server (mlatc). Either or both.
[[feed]]
name = "example"
mlat = "mlat.example.net:31090"
# adsb = "feed.example.net:30004"   # only with [programs].readsb set
# uuid = "00000000-0000-0000-0000-000000000000"

[results]
# Where returned MLAT positions go, as Beast frames (a readsb ingest
# port). Omit to discard results.
# beast_connect = "127.0.0.1:31004"

[status]
listen = "127.0.0.1:8654"

[programs]
# Paths to the supervised binaries; the defaults find them on PATH.
mlatc = "mlatc"
# The radio for a local dongle: rx (the Station radio) with readsb as its
# fallback, or readsb alone. Both take the same flags. With `radio` set,
# readsb takes over after three crashes in ten minutes or fifteen silent
# minutes, and the status page says so.
# radio = "/home/station/station/rx --device-type rtlsdr --gain auto ..."
# readsb = "/usr/bin/readsb --device-type rtlsdr ..."  # supervised when set

# Setup options (not part of this file): `stationd --station-key <uuid>`
# (or STATION_KEY in the environment) makes setup show a key you kept
# instead of a new one; `stationd --import station.imported.toml` starts
# setup from the feeds and key of a receiver this machine ran before.
# The installer writes that file (`sh install.sh --replace`) from
# readsb's or ultrafeeder's configuration: [[feed]] blocks as above plus
# `station_key = "..."` at the top.
